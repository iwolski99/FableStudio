name: Build

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  build:
    name: ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows
            os: windows-latest
            artefact_paths: |
              build/FableStudio_artefacts/Release/FableStudio.exe
          - name: macOS
            os: macos-latest
            artefact_paths: |
              build/FableStudio_artefacts/Release/FableStudio.app
          - name: Linux
            os: ubuntu-latest
            artefact_paths: |
              build/FableStudio_artefacts/Release/FableStudio

    steps:
      - uses: actions/checkout@v4

      - name: Install Linux dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y ninja-build libasound2-dev libfreetype6-dev \
            libfontconfig1-dev libx11-dev libxcomposite-dev libxcursor-dev \
            libxext-dev libxinerama-dev libxrandr-dev libxrender-dev

      - name: Configure
        run: cmake -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel 4

      - name: Run unit tests
        run: |
          cmake --build build --config Release --target FableTool --parallel 4
          ./build/FableTool_artefacts/Release/FableTool test
        if: runner.os != 'Windows'

      - name: Run unit tests (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          cmake --build build --config Release --target FableTool --parallel 4
          & "build/FableTool_artefacts/Release/FableTool.exe" test

      - name: Render demo song (smoke test)
        if: runner.os == 'Linux'
        run: |
          ./build/FableTool_artefacts/Release/FableTool render-demo demo.wav
          test -s demo.wav

      - name: Upload binaries
        uses: actions/upload-artifact@v4
        with:
          name: FableStudio-${{ matrix.name }}
          path: ${{ matrix.artefact_paths }}
          if-no-files-found: error
